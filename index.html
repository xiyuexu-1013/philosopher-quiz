  { id: 'Q2', section: '面对世界的方式', text: '你对"真理"的看法更接近……', options: [ { key: 'A', text: '真理是客观存在的，等待我们去发现。' }, { key: 'B', text: '真理是相对的，取决于看问题的角度。' }, { key: 'C', text: '真理需要被不断追问，过程比答案重要。' } ] },
  { id: 'Q3', section: '面对世界的方式', text: '你认为人类痛苦的根源是什么？', options: [ { key: 'A', text: '欲望太多，无法满足。' }, { key: 'B', text: '人与人之间的不理解与隔阂。' }, { key: 'C', text: '对死亡和无常的恐惧。' } ] },

  "毕达哥拉斯": { tag: "秩序敏感 · 审美理性", quote: "万物皆数。", color: "#D4A53C", colorName: "几何金", career: "适合数学、音乐、建筑、编程。你是秩序感知者。", soul: "在混沌中寻找秩序。对数字、节奏、比例有天然亲和力。情感有一套自己的算法。", weakness: "把世界数字化，挡住了无法数字化的东西（爱的盲目、即兴的美）。", prescription: ["刻意制造一次无序。", "尝试不靠逻辑的艺术。", "万物皆数，但不只是数。"], books: ["《哥德尔、艾舍尔、巴赫》", "《数学之美》"] },
  "伊壁鸠鲁": { tag: "温和享乐者 · 追求宁静", quote: "快乐是幸福生活的起点。", color: "#7A9A5A", colorName: "苔藓绿", career: "适合生活方式、心理、园艺。你懂少即是多。", soul: "清醒的享乐主义者。追求无痛苦的宁静。擅长从简单事物中找到快乐。", weakness: "知足易被误解为缺野心。快乐哲学面对真正苦难时可能显轻巧。", prescription: ["区分知足和妥协。", "偶尔做件不舒服但有意的事。", "快乐是有能力选择痛苦时保持清醒。"], books: ["《伊壁鸠鲁学派文选》", "《瓦尔登湖》"] },
  "芝诺": { tag: "逻辑锋利 · 拆解大师", quote: "飞矢不动。", color: "#C0C0C0", colorName: "银刃", career: "适合法律辩论、逻辑、数学。你是认知清道夫。", soul: "天生逻辑拆解者。测试以为的真理有多牢固。和你对话累但过瘾。", weakness: "拆解了一切，未必能建造。证明飞矢不动，却错过箭中靶心的美。", prescription: ["每天找一件不拆解的事。", "用讲故事代替讲逻辑。", "悖论是边界，边界外是生活。"], books: ["《芝诺残篇》", "《哲学家的石头》"] },
  "第欧根尼": { tag: "极度自由 · 物质极简", quote: "别挡住我的阳光。", color: "#F5D98E", colorName: "日光黄", career: "适合自由职业、极简、流浪创作。不适合体制化。", soul: "对外在于己持傲慢冷淡。不care金钱名誉。在所有人追求更多时，选择更少。", weakness: "不care有时是防御。拒绝受伤，也拒绝被滋养。自由代价是不被深刻理解。", prescription: ["主动依赖一个人一次。", "区分不需要和不敢要。", "桶再自在，不如房间暖和。"], books: ["《第欧根尼传》", "《荒野生存》"] },
  "马可·奥勒留": { tag: "情绪稳定 · 内在帝王", quote: "你拥有控制自己思想的权力。", color: "#8B7D3C", colorName: "罗马金", career: "适合管理、危机公关、行政。你是情绪稳压器。", soul: "风暴中保持呼吸的人。相信外部不可控，内部绝对可控。是自己心灵的皇帝。", weakness: "控制得太好，内心像宫殿却没窗。冷静避免崩溃，也错过狂喜。", prescription: ["每周找一晚把控制放门外。", "问自己不控制会怎样。", "帝王也需要休假。"], books: ["《沉思录》", "《活出意义来》"] },
  "塞涅卡": { tag: "清醒的悲观 · 极高韧性", quote: "命运眷顾勇者，但勇者从不等待命运。", color: "#7A7A7A", colorName: "暮云灰", career: "适合临终关怀、心理、危机管理。直面悲剧但依然前行。", soul: "清醒知道生命有限，却不恐惧。悲剧式的坦然：承认世界不公，但决定保持高贵。", weakness: "太习惯扛。很少允许自己崩溃，觉得不体面。", prescription: ["允许自己不体面一次。", "勇气是允许脆弱。", "接受死亡，也拥抱生活。"], books: ["《论生命之短暂》", "《当呼吸化为空气》"] },
  "奥古斯丁": { tag: "永恒寻找者 · 深度反省", quote: "我们的心永不安息，直到安息于你。", color: "#E8A040", colorName: "烛火橙", career: "适合神学、心理、精神导师。一生都在帮人理解人到底要什么。", soul: "归乡者。一生寻找归属。试过激情、知识、声望，总发现不是这个。", weakness: "渴望强烈，易把像答案的东西当答案。容易沉迷、神化，发现不完美时又失望。", prescription: ["把寻找换成建设。", "区分渴望和逃避。", "安息于自己内心，非外部。"], books: ["《忏悔录》", "《回归》"] },
  "孔子": { tag: "秩序守护者 · 善于教化", quote: "己所不欲，勿施于人。", color: "#8B6B4F", colorName: "礼器褐", career: "适合教育、管理、传统文化。你是秩序守护者。", soul: "秩序守护者。相信世界变好是克己复礼。重视传统不守旧，重视规矩不僵化。", weakness: "把秩序维持太好，身边人习惯依赖，忘了你的疲惫。克己太久，偶尔也想问：那我呢？", prescription: ["每周做件不合礼的小事。", "己所欲，亦勿强加于人。", "七十岁才从心所欲，慢慢来。"], books: ["《论语》", "《大学》"] },
  "孟子": { tag: "坚信善良 · 唤醒者", quote: "人皆有不忍人之心。", color: "#6FAF6B", colorName: "春芽绿", career: "适合教育、公益、心理。你是点燃者。", soul: "相信人性本善。内心有不灭火，坚信再坏的人也有柔软处。有拯救者本能。", weakness: "对恶免疫力不高。面对真正的恶会受巨大冲击。拯救者情结易被消耗。", prescription: ["接受善恶可能同时为真。", "把拯救换成陪伴。", "穷则独善其身，先救自己。"], books: ["《孟子》", "《活出生命的意义》"] },
  "荀子": { tag: "现实主义者 · 制度信仰", quote: "人之性恶，其善者伪也。", color: "#4A4A4A", colorName: "墨石黑", career: "适合法律、政策、制度设计。你是制度派。", soul: "现实主义者。对性善冷眼，重视教育和规则。相信好制度让坏人变好。", weakness: "现实感太强，错过例外。重规则有时忽略个体温度和复杂性。", prescription: ["找三个打破规则却依然好的例子。", "区分现实和悲观。", "伪是被塑造的美。"], books: ["《荀子》", "《公正》"] },
  "老子": { tag: "柔韧如水 · 不争的智慧", quote: "道可道，非常道。", color: "#4A7A8C", colorName: "水蓝", career: "适合战略、作家、冥想导师。你是以退为进的人。", soul: "相信最强大力量是不争。有罕见耐心，像水知道流向低处。在所有人抢时选择后退。", weakness: "不争易被误解为不求。在需主动出击时可能错过。太信任自然发生。", prescription: ["每月做一次主动争取实验。", "区分顺应和被动。", "老子不争，但他有言。"], books: ["《道德经》", "《薄伽梵歌》"] },
  "庄子": { tag: "逍遥派 · 自由不羁", quote: "子非鱼，安知鱼之乐？", color: "#4B8B9B", colorName: "蝶翼青", career: "适合自由创作、旅行、艺术。你是天生的游者。", soul: "天生逍遥者。不在意世俗成功，不被应该绑架。生命最高境界是游。", weakness: "逍遥有时是不介入。太擅长看开，错过在意的深度。", prescription: ["为某件事不逍遥一次。", "区分看开和回避。", "鼓盆而歌唱的是歌，不是冷漠。"], books: ["《庄子》", "《禅与摩托车维修艺术》"] },
  "韩非子": { tag: "冷峻洞察 · 制度至上", quote: "刑过不避大臣，赏善不遗匹夫。", color: "#2D2D2D", colorName: "玄铁黑", career: "适合法律、审计、内控、策略。你是系统清醒者。", soul: "对权力和人性有冷峻洞察。不信道德感化，信利害驱动。思维像手术刀。", weakness: "冷峻洞察难被欺骗，也难被温暖。太清楚算计，当有人无条件好时第一反应是怀疑。", prescription: ["每周做件不基于利害的事。", "给一个人无条件信任一次。", "清醒的人往往最孤独。"], books: ["《韩非子》", "《君主论》"] },
  "王阳明": { tag: "知行合一 · 行动派", quote: "致良知。", color: "#C0392B", colorName: "知行红", career: "适合创业、行动管理、教育。你是先干起来的人。", soul: "行动派的心学家。不信真理在书里，信在心里被知行合一活出来。厌恶空谈。", weakness: "知行合一有时让知跟不上行。太急于行动，可能没充分理解就冲出去。", prescription: ["做之前多停三秒。", "区分良知直觉和习惯本能。", "龙场悟道前也有漫长沉默。"], books: ["《传习录》", "《干法》"] },
  "朱熹": { tag: "系统构建者 · 求知狂", quote: "存天理，灭人欲。", color: "#B8956A", colorName: "竹简棕", career: "适合学术、图书馆、教育、出版。你是搭建知识体系的天才。", soul: "格物穷理的人。相信规律可被认识。对知识有虔诚尊重，严谨、系统、勤奋。", weakness: "格物太多，忘了格心。存天理太好，灭人欲太彻底，活成精密系统。", prescription: ["做件毫无理由的事。", "把一本书不批注地读一遍。", "他的爱，藏在克制里。"], books: ["《四书章句集注》", "《如何阅读一本书》"] },
  "慧能": { tag: "通透 · 不着相", quote: "本来无一物，何处惹尘埃。", color: "#F0F0F0", colorName: "空性白", career: "适合禅修、写作、艺术、极简。你是不着相的人。", soul: "天生空性者。有着相能力，不看表面，不在乎标签。相信直指人心。", weakness: "空有时让你显冷。不执着，也难炽热。太擅长不惹尘埃，错过快乐。", prescription: ["刻意着相一次。", "区分空性和疏离。", "重点不是无所住，是生其心。"], books: ["《六祖坛经》", "《活在此时此刻》"] },
  "张载": { tag: "使命感驱动 · 宏大叙事者", quote: "为天地立心，为生民立命。", color: "#6B6B6B", colorName: "山脊灰", career: "适合社会企业、公共政策、公益。你是有使命感的人。", soul: "有使命感。难忍受庸碌，觉得应做点配得上活着的事。理想很大，脚踩在地上。", weakness: "为万世是巨大目标，既是燃料也是枷锁。理想太高远，易觉不够好。", prescription: ["把为万世改成为一世。", "在为生民里加上为自己。", "理想现实从不相悖。"], books: ["《正蒙》", "《曾国藩传》"] },
  "周敦颐": { tag: "底层逻辑者 · 整体性思维", quote: "无极而太极。", color: "#1A1A1A", colorName: "太极黑", career: "适合基础科学、哲学、理论物理。你是第一性原理思考者。", soul: "在纷繁中看到一。相信万物背后有统一原理。不喜欢碎片，喜欢追问根本上是什么。", weakness: "太关心一，忽略多的价值。试图统一所有，但矛盾、冲突也是真实的一部分。", prescription: ["尝试不整合，让矛盾共存。", "深度观察小事物，不找规律。", "他也感受一株草的生机。"], books: ["《太极图说》", "《万物简史》"] },
  "康德": { tag: "极度自律 · 理性至上", quote: "头顶的星空，心中的道德律。", color: "#3D2A54", colorName: "暮紫", career: "适合法律、学术、审计、数据。你的价值是校准。", soul: "依赖秩序，为不被混沌吞没。信理性是可靠工具，也知有边界。活在自律中，出于尊重。", weakness: "太信应该，忘了实际。世界不按逻辑运行时深刻失望。易把自律误当自虐。", prescription: ["允许偶尔不讲道理享受。", "道德律令从必须调为可以。", "星空美，草地也有温度。"], books: ["《纯粹理性批判》", "《小王子》"] },
  "尼采": { tag: "反叛者 · 生命力旺盛", quote: "那些杀不死我的，使我更强大。", color: "#F4C430", colorName: "雷霆黄", career: "适合创业、艺术、思想写作。你是重估一切价值的人。", soul: "体内有团火。对平庸生理性反感。信生命本质是权力意志——成为自己最极致版本。", weakness: "强大建立在危险假设上：永远有力量面对打击。当某些东西真杀死你时，可能没那么强大。", prescription: ["改成有些东西杀不死我，但让我休息。", "为脆弱保留房间。", "他抱马时是心痛的人。"], books: ["《查拉图斯特拉如是说》", "《当尼采哭泣》"] },
  "叔本华": { tag: "诚实悲观 · 洞察极深", quote: "人生如钟摆，在痛苦与无聊之间。", color: "#B0B0B0", colorName: "薄雾灰", career: "适合哲学、心理、艺术批评。你是看透却依然在场的角色。", soul: "目光带层薄灰。不信未来会更好。早看穿追逐欲望是痛苦，满足是无聊。只是早接受这就是人生。", weakness: "看透少了很多失望，也少了很多惊喜。提前知道结果，不愿投入过程。", prescription: ["用艺术调节悲观。", "尝试一次非理性行动。", "悲观主义者也需要活物来爱。"], books: ["《作为意志和表象的世界》", "《人生的智慧》"] },
  "海德格尔": { tag: "存在敏感 · 常常出神", quote: "人是被抛入世界的。", color: "#2D4F3C", colorName: "森林绿", career: "适合哲学、存在心理、文学。需允许你停下问为什么的空间。", soul: "从小隐隐觉得不对劲。无法理所当然活着，总追问活着意味什么。直面存在本身。", weakness: "向死而生是诚实，但也难活在当下。总在观看自己活着，而非真正在活。", prescription: ["把存在追问放一边，今天只是在。", "做不需反思的事。", "他也感受林间的风。"], books: ["《存在与时间》", "《当尼采哭泣》"] },
  "萨特": { tag: "极度自由 · 为自己负责", quote: "人是自由的，人注定自由。", color: "#C41E3A", colorName: "存在红", career: "适合创业、创作、自由职业。需能让你说了算的空间。", soul: "拒绝任何借口。信你是什么，是选择的结果。自由是荣耀也是负担。每次选择都感到重量。", weakness: "自由是孤独的自由。拒绝托付、依赖。把自己活成孤岛。自由以被抛弃为代价。", prescription: ["尝试一次不自由的选择。", "区分自由和孤立。", "自由的重量也是可以分享的。"], books: ["《存在与虚无》", "《西西弗斯神话》"] },
  "加缪": { tag: "觉醒者 · 坚韧不放弃", quote: "我们必须想象西西弗斯是幸福的。", color: "#1A6B8A", colorName: "地中海蓝", career: "适合明知难但依然在做的领域。你是荒谬英雄。", soul: "明知无望但依然前行。看见荒谬，但选择继续推石头。反抗不是胜利，是继续本身。", weakness: "荒谬英雄人设很酷，但很累。一直推石头，忘了问：可不可以休息一下？", prescription: ["给石头放一天假。", "区分反抗和执念。", "答案不是死亡，是活着。"], books: ["《西西弗斯神话》", "《局外人》"] },
  "福柯": { tag: "批判者 · 拆穿伪装", quote: "知识即权力。", color: "#D0D0D0", colorName: "镜面银", career: "适合学术批判、媒体、法律、社会研究。你是体制的眼睛。", soul: "对理所当然警惕。追问谁定义的？为了谁？信世界是被构建、被权力塑造的。", weakness: "拆穿了一切，住在哪里？不信任何结构，如何安放自己？锋利的刀不能当床睡。", prescription: ["找件不值得批判的事让它存在。", "参与具体社群感受归属。", "身体比权力更真实。"], books: ["《规训与惩罚》", "《疯癫与文明》"] },
  "德里达": { tag: "语言敏感 · 优雅的怀疑者", quote: "文本之外，别无他物。", color: "#74766b", colorName: "棱镜彩", career: "适合翻译、文化研究、创意写作。你是意义拆解者。", soul: "信一切在被解读。对终极真相优雅怀疑。擅长拆解二元对立，让它们露出裂缝。", weakness: "解构能力让你难站稳。总看见另一面，无法果断选择。过度解构让行动不可能。", prescription: ["某些事禁止解构，直接说我信。", "区分语言局限和存在实在。", "解构是重新打开可能。"], books: ["《书写与差异》", "《为什么读经典》"] },

const DIMENSION_KEYS = ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8'];

function calculateRawVector(answers) {
    let raw = { D1: 0, D2: 0, D3: 0, D4: 0, D5: 0, D6: 0, D7: 0, D8: 0 };
    for (let qId in answers) {
        let choice = answers[qId];
        let mapping = QUESTION_MAPPING[qId]?.[choice];
        if (mapping) {
            for (let dim in mapping) raw[dim] += mapping[dim];
        }
    }
    return raw;
}

function normalizeVector(rawVector) {
    let normalized = {};
    const minPossible = -5;
    const maxPossible = 35;
    const range = maxPossible - minPossible;
    for (let dim of DIMENSION_KEYS) {
        let raw = rawVector[dim];
        let score = ((raw - minPossible) / range) * 9 + 1;
        normalized[dim] = Math.max(1, Math.min(10, score));
    }
    return normalized;
}

function cosineSimilarity(vecA, vecB) {
    let dot = 0, normA = 0, normB = 0;
    const weights = { D1: 1.2, D2: 1.0, D3: 0.9, D4: 1.2, D5: 1.0, D6: 1.1, D7: 1.0, D8: 0.9 };
    for (let i = 0; i < DIMENSION_KEYS.length; i++) {
        let d = DIMENSION_KEYS[i];
        let w = weights[d];
        dot += w * vecA[i] * vecB[i];
        normA += w * Math.pow(vecA[i], 2);
        normB += w * Math.pow(vecB[i], 2);
    }
    if (normA === 0 || normB === 0) return 0;
    return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}

function getFinalResult(answers) {
    let rawVector = calculateRawVector(answers);
    let finalUserVector = normalizeVector(rawVector);
    let userArray = DIMENSION_KEYS.map(k => finalUserVector[k]);
    let scores = [];
    for (let name in PHILOSOPHER_VECTORS) {
        let sim = cosineSimilarity(userArray, PHILOSOPHER_VECTORS[name]);
        scores.push({ name: name, score: sim });
    }
    scores.sort((a, b) => b.score - a.score);
    return { 
        bestMatch: scores[0], 
        worstMatch: scores[scores.length - 1],
        userVector: finalUserVector 
    };
}

function generateArchiveId() {
    const now = new Date();
    const dateStr = now.getFullYear().toString() +
                    (now.getMonth() + 1).toString().padStart(2, '0') +
                    now.getDate().toString().padStart(2, '0');
    const timeStr = now.getHours().toString().padStart(2, '0') +
                    now.getMinutes().toString().padStart(2, '0') +
                    now.getSeconds().toString().padStart(2, '0');
    const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
    return `#PHI-${dateStr}-${timeStr}-${randomStr}`;
}

function formatDateTime() {
    const now = new Date();
    const year = now.getFullYear();
    const month = (now.getMonth() + 1).toString().padStart(2, '0');
    const day = now.getDate().toString().padStart(2, '0');
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
}

function render(){
if(currentStep==='welcome'){
shell(`<section class="welcome"><div class="welcome-copy"><h1>寻找你的<br>精神镜像。</h1><p class="intro">一场关于自己的哲学测试。<br>从 25 道追问出发，在 50 位思想家中，找到与你共鸣的声音。</p><button class="primary" onclick="startQuiz()">开始探索<span aria-hidden="true">↗</span></button><p class="under-action">无需准备。选择最贴近当下的答案。</p></div><aside class="thought-preview" aria-label="思想家档案预览"><div class="preview-head"><h2>先与一个想法相遇</h2><span>档案选读</span></div><div class="reading-controls"><label class="sr-only" for="thinker-select">选择思想家</label><select id="thinker-select" onchange="selectThought(this.value)">${THINKER_NAMES.map(n=>`<option value="${n}" ${n===selectedThought?'selected':''}>${n}</option>`).join('')}</select><button class="browse-thinkers" onclick="openThinkerLibrary()">浏览全部 50 位 ↗</button></div><div id="thought-content" aria-live="polite">${thoughtContent(selectedThought)}</div><div class="preview-foot"><span id="reading-count">${THINKER_NAMES.indexOf(selectedThought)+1} / ${THINKER_NAMES.length} 位</span><div class="reading-pager"><button onclick="stepThought(-1)" aria-label="上一位思想家">←</button><button onclick="stepThought(1)" aria-label="下一位思想家">→</button></div></div></aside></section><section class="summary" aria-label="测试路径"><div><strong>25<small>道深度追问</small></strong><p>日常选择里的内在信念</p></div><div><strong>8<small>个思想维度</small></strong><p>理性、情感，以及更多面向</p></div><div><strong>50<small>位思想家</small></strong><p>跨越时代的精神对话</p></div></section>`);
}else if(currentStep==='quiz'){
const q=QUESTIONS[currentQuestionIndex],done=Object.keys(userAnswers).length;
shell(`<section class="quiz-layout"><aside class="quiz-aside"><h2>你的思想之旅</h2><p>慢慢想，让直觉作答。</p><ol class="chapters">${chapters.map((c,i)=>`<li class="${c===q.section?'active':chapters.indexOf(q.section)>i?'done':''}" ${c===q.section?'aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span>${c.replaceAll('/',' · ')}</li>`).join('')}</ol></aside><div class="quiz-panel"><div class="quiz-meta"><span>${q.section.replaceAll('/',' · ')}</span><span class="quiz-count">${String(currentQuestionIndex+1).padStart(2,'0')} / ${QUESTIONS.length}</span></div><div class="progress" role="progressbar" aria-label="已回答题目" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${QUESTIONS.length}"><span style="width:${done/QUESTIONS.length*100}%"></span></div><h1 class="question-text" tabindex="-1">${q.text}</h1><p class="question-help">选择最接近你的一项，选后进入下一题。</p><div class="options-container">${q.options.map(o=>`<button class="option-btn" onclick="selectAnswer('${q.id}','${o.key}')" aria-pressed="${userAnswers[q.id]===o.key}"><span class="option-letter">${o.key}</span><span>${o.text}</span><span class="option-arrow" aria-hidden="true">→</span></button>`).join('')}</div><div class="quiz-bottom"><button onclick="goBack()" ${currentQuestionIndex===0?'disabled':''}>← 上一题</button><span class="key-hint">也可按 A / B / C 选择</span><span>已完成 ${done} 题</span></div></div></section>`);
}else{
const r=getFinalResult(userAnswers),m=r.bestMatch,w=r.worstMatch,meta=PHILOSOPHER_META[m.name];
if(!currentArchiveId){currentArchiveId=generateArchiveId();currentArchiveTime=formatDateTime();currentWorstMatch=w;}
shell(`<section class="result"><div class="report-top"><div><h1>你的精神镜像</h1><p>由你的 ${QUESTIONS.length} 次选择，勾勒而成。</p></div><button class="secondary" onclick="restart()">重新探索 ↗</button></div><article class="report-sheet" id="result-card"><div class="archive-info"><span class="archive-id">${currentArchiveId}</span><span>${currentArchiveTime}</span></div><div class="result-grid"><div><p class="result-tag">与你共鸣的思想家</p><h2 class="thinker-name">${m.name}</h2><p class="thinker-tag">${meta.tag}</p><blockquote class="quote">“${meta.quote}”</blockquote><div class="match-line"><strong class="match-score">${(m.score*100).toFixed(1)}<small style="font-size:16px">%</small></strong><span>思想向量相似度</span></div><div class="color-badge"><span class="color-dot" style="background:${meta.color.includes('gradient')?'#77786b':meta.color}"></span>精神底色 · ${meta.colorName}</div></div><div class="chart-block"><h3 class="chart-title">你的八维思想坐标</h3><div class="chart-container">${radar(r.userVector)}</div><p class="chart-note">各维度 1—10 分 · 依据本测试的回答计算</p></div></div><div class="reading-grid">${[['灵魂素描',meta.soul],['人生规划',meta.career],['隐秘软肋',meta.weakness]].map(([t,c])=>`<section class="section"><h3>${t}</h3><p class="section-content">${c}</p></section>`).join('')}<section class="section"><h3>存在处方</h3><ol>${meta.prescription.map(p=>`<li class="list-item">${p}</li>`).join('')}</ol></section><section class="section"><h3>精神食粮</h3><div class="books">${meta.books.map(b=>`<span class="book">${b}</span>`).join('')}</div></section></div><section class="anti-match"><div><h3>另一端的思想</h3><p class="anti-match-name">${w.name}</p></div><div><p class="anti-match-desc">相似度 ${(w.score*100).toFixed(1)}%。与你差异最大的视角，也可能带来新的启发。</p><p class="anti-match-quote">“${PHILOSOPHER_META[w.name].quote}”</p></div></section><p class="report-foot">这是一份自我探索的邀请。相似度仅表示本测试中的向量接近程度。</p></article><div class="report-actions"><button class="primary save-btn" onclick="saveImage()">保存思想档案<span aria-hidden="true">↓</span></button><button class="secondary" onclick="restart()">再探索一次</button></div><p class="save-status" role="status" id="save-status"></p></section>`);
}
}
function radar(v){
const labels=['理性','理想','行动','个体','情感','批判','存在','共情'],cx=200,cy=155,R=100;
const point=(i,r)=>[cx+Math.sin(i*Math.PI/4)*r,cy-Math.cos(i*Math.PI/4)*r];
const poly=r=>labels.map((_,i)=>point(i,r).join(',')).join(' ');
return `<svg viewBox="0 0 400 310" role="img" aria-label="思想坐标：${labels.map((n,i)=>n+v[DIMENSION_KEYS[i]].toFixed(1)+'分').join('，')}">${[2,4,6,8,10].map(t=>`<polygon points="${poly(R*t/10)}" fill="none" stroke="#e5e7e1" stroke-width="1"/><text x="205" y="${cy-R*t/10-3}" fill="#656660" font-size="11">${t}</text>`).join('')}${labels.map((n,i)=>{const [x,y]=point(i,R),[tx,ty]=point(i,R+30);return `<path d="M${cx} ${cy}L${x} ${y}" stroke="#e5e7e1"/><text x="${tx}" y="${ty+4}" text-anchor="middle" fill="#656660" font-size="12">${n}</text>`}).join('')}<polygon points="${labels.map((_,i)=>point(i,v[DIMENSION_KEYS[i]]/10*R).join(',')).join(' ')}" fill="#35695c" fill-opacity=".12" stroke="#35695c" stroke-width="1.8"/></svg>`;
}
function focusQuestion(){document.querySelector('.question-text')?.focus({preventScroll:true});}
function startQuiz(){currentQuestionIndex=0;userAnswers={};currentArchiveId='';currentArchiveTime='';currentStep='quiz';render();window.scrollTo(0,0);focusQuestion();}
function selectAnswer(id,key){if(currentStep!=='quiz'||id!==QUESTIONS[currentQuestionIndex].id)return;userAnswers[id]=key;if(currentQuestionIndex<QUESTIONS.length-1){currentQuestionIndex++;}else{currentStep='result';}render();window.scrollTo(0,0);focusQuestion();}
function goBack(){if(currentQuestionIndex>0){currentQuestionIndex--;render();focusQuestion();}}
function restart(){currentStep='welcome';currentArchiveId='';currentArchiveTime='';currentWorstMatch=null;userAnswers={};render();window.scrollTo(0,0);}
function home(){if(currentStep==='quiz'){document.getElementById('leave').showModal();}else{restart();}}
addEventListener('keydown',e=>{if(currentStep!=='quiz'||document.querySelector('dialog[open]')||e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();if(['A','B','C'].includes(k)){e.preventDefault();selectAnswer(QUESTIONS[currentQuestionIndex].id,k);}});
async function saveImage(){
const card=document.getElementById('result-card'),btn=document.querySelector('.save-btn'),status=document.getElementById('save-status');
if(!card||!btn)return;
btn.disabled=true;const old=btn.innerHTML;btn.textContent='正在生成…';status.textContent='';
try{
if(typeof html2canvas==='undefined')throw new Error('图片组件尚未加载，请连接网络后重试。');
await document.fonts.ready;
const canvas=await html2canvas(card,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false,windowWidth:Math.max(390,innerWidth)});
const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw new Error('图片生成失败，请重试。');
const url=URL.createObjectURL(blob),a=document.createElement('a');a.download=`精神镜像_${document.querySelector('.thinker-name').textContent}_${currentArchiveId.replace('#','')}.png`;a.href=url;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='思想档案已生成，请查看浏览器下载。';
}catch(e){status.textContent=e.message||'保存失败，请重试。';}finally{btn.disabled=false;btn.innerHTML=old;}
}
render();
</script></body></html>
